[project]
name = "baymon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naren Sengodan", email = "scartegy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "supabase>=2.32.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
baymon = "baymon:main"
baymon-api = "baymon.api:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
