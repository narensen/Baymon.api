[project]
name = "baymon"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naren Sengodan", email = "scartegy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.1",
    "groq>=1.7.0",
    "pillow>=13.0.0",
    "prompt-toolkit>=3.0.53",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "sounddevice>=0.5.6 ; sys_platform != 'linux'",
    "supabase>=2.32.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
baymon = "baymon.cli:main"
baymon-api = "baymon.api:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
